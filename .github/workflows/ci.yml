name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end, accessibility, access control, load
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright (builds and starts the app on an in-memory database)
        run: pnpm --filter web e2e --trace off
      - name: Load test
        working-directory: apps/web
        run: |
          DATA_DIR=memory FAKE_NOW=2026-11-30T04:00:00.000Z pnpm exec next start -p 3100 &
          for i in $(seq 1 60); do curl -sf localhost:3100/api/v1/openapi.json > /dev/null && break; sleep 1; done
          BASE=http://localhost:3100 node scripts/load.mjs 60 20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
